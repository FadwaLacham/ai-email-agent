name: AI Email Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Email Scheduler
        run: |
          curl --fail-with-body -X POST \
            "https://ai-email-agent-backend.fastapicloud.dev/scheduler/run" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}"