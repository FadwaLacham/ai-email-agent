name: AI Email Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  run-scheduler:

    runs-on: ubuntu-latest

    steps:

      - name: Trigger Email Agent

        run: |

          curl --fail-with-body \
            -X POST \
            "https://ai-email-agent-backend.fastapicloud.dev/scheduler/run" \
            -H "X-Scheduler-Secret: ${{ secrets.SCHEDULER_SECRET }}"